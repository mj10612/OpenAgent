[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent"
version = "0.1.0"
description = "A model-agnostic AI coding agent for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenAgent Contributors" }]
keywords = ["ai", "agent", "coding-agent", "llm", "cli", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.0",
  "prompt-toolkit>=3.0.36",
  "jsonschema>=4.0",
  "jsonpath-ng>=1.6",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.8",
  "ruff>=0.5",
]
ollama = ["ollama>=0.3"]

[project.scripts]
openagent = "openagent.cli:main"

[project.urls]
Homepage = "https://github.com/mj10612/OpenAgent"
Documentation = "https://github.com/mj10612/OpenAgent/tree/main/docs"
Issues = "https://github.com/mj10612/OpenAgent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
ignore_missing_imports = true
